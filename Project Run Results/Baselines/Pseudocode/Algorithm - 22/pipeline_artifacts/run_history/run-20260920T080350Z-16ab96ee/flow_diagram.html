<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL-FDEP Flow Diagram</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>
<header>
<h1>NL to Flow Diagram Encoder Pipeline</h1>
<p>Standard flowchart notation generated from AJ pseudocode.</p>
<div class="controls">
<input id="search" placeholder="Search step, type, line, or node ID">
<button id="zoom-in" type="button">Zoom in</button>
<button id="zoom-out" type="button">Zoom out</button>
<button id="fit" type="button">Fit diagram</button>
</div>
</header>
<div id="viewport" class="viewport">
<svg id="diagram" viewBox="0 0 1460 1474" role="img" aria-label="Generated program flow diagram">

<path d="M 0 0 L 9 3.5 L 0 7 z" fill="#252a31"></path>
</marker>
</defs>

ct class="shape" x="440.0" y="878" width="230" height="64" rx="4" ry="4"></rect><text x="555.0" y="895.0"><tspan x="555.0" dy="0">Attempt the following</tspan><tspan x="555.0" dy="16">operations</tspan></text><text class="metadata" x="555.0" y="929">Line 4 · F6</text></g><g class="flow-node" data-node-id="F7"><title>PROCESS | Line 5 | F7</title><rect class="shape" x="90.0" y="1075" width="230" height="64" rx="4" ry="4"></rect><text x="205.0" y="1092.0"><tspan x="205.0" dy="0">Set givenNum to givenNum</tspan><tspan x="205.0" dy="16">converted to integer</tspan></text><text class="metadata" x="205.0" y="1126">Line 5 · F7</text></g><g class="flow-node" data-node-id="F8"><title>PROCESS | Line 6 | F8</title><rect class="shape" x="615.0" y="1272" width="230" height="64" rx="4" ry="4"></rect><text x="730.0" y="1297.0"><tspan x="730.0" dy="0">Set loop to false</tspan></text><text class="metadata" x="730.0" y="1323">Line 6 · F8</text></g><g class="flow-node" data-node-id="F9"><title>OUTPUT | Line 8 | F9</title><polygon class="shape" points="464.0,1075 670.0,1075 646.0,1139 440.0,1139"></polygon><text x="555.0" y="1092.0"><tspan x="555.0" dy="0">Display &quot;That&#x27;s Not an</tspan><tspan x="555.0" dy="16">Integer, Please Try Again!&quot;</tspan></text><text class="metadata" x="555.0" y="1126">Line 8 · F9</text></g><g class="flow-node" data-node-id="F10"><title>PROCESS | Line 11 | F10</title><rect class="shape" x="790.0" y="681" width="230" height="64" rx="4" ry="4"></rect><text x="905.0" y="706.0"><tspan x="905.0" dy="0">Set total to 1</tspan></text><text class="metadata" x="905.0" y="732">Line 11 · F10</text></g><g class="flow-node" data-node-id="F11"><title>LOOP_DECISION | Line 12 | F11</title><polygon class="shape" points="905.0,878 1020.0,934.0 905.0,990 790.0,934.0"></polygon><text x="905.0" y="927.0"><tspan x="905.0" dy="0">GivenNum is greater than 0?</tspan></text><text class="metadata" x="905.0" y="977">Line 12 · F11</text></g><g class="flow-node" data-node-id="F1 </svg>
</div>
<div class="legend">Oval: Start/End<br>Diamond: Decision<br>Parallelogram: Input/Output<br>Rectangle: Process<br>Double rectangle: Function/Call</div>
<script>
const diagramData = {"format": "NL-FDEP Flow Diagram", "version": "1.0", "entry_node": "F1", "exit_node": "F2", "nodes": {"F1": {"node_id": "F1", "node_type": "START", "label": "Start", "line": 1, "data": {}}, "F2": {"node_id": "F2", "node_type": "END", "label": "End", "line": 1, "data": {}}, "F3": {"node_id": "F3", "node_type": "PROCESS", "label": "Set loop to true", "line": 1, "data": {"ast_kind": "AssignmentNode"}}, "F4": {"node_id": "F4", "node_type": "LOOP_DECISION", "label": "Loop is equal to true?", "line": 2, "data": {"ast_kind": "WhileNode"}}, "F5": {"node_id": "F5", "node_type": "PROCESS", "label": "Set givenNum to input prompted by \"Enter Number: \"", "line": 3, "data": {"ast_kind": "AssignmentNode"}}, "F6": {"node_id": "F6", "node_type": "TRY", "label": "Attempt the following operations", "line": 4, "data": {"ast_kind": "TryCatchNode"}}, "F7": {"node_id": "F7", "node_type": "PROCESS", "label": "Set givenNum to givenNum converted to integer", "line": 5, "data": {"ast_kind": "AssignmentNode"}}, "F8": {"node_id": "F8", "node_type": "PROCESS", "label": "Set loop to false", "line": 6, "data": {"ast_kind": "AssignmentNode"}}, "F9": {"node_id": "F9", "node_type": "OUTPUT", "label": "Display \"That's Not an Integer, Please Try Again!\"", "line": 8, "data": {"ast_kind": "OutputNode"}}, "F10": {"node_id": "F10", "node_type": "PROCESS", "label": "Set total to 1", "line": 11, "data": {"ast_kind": "AssignmentNode"}}, "F11": {"node_id": "F11", "node_type": "LOOP_DECISION", "label": "GivenNum is greater than 0?", "line": 12, "data": {"ast_kind": "WhileNode"}}, "F12": {"node_id": "F12", "node_type": "PROCESS", "label": "Set total to total multiplied by givenNum", "line": 13, "data": {"ast_kind": "AssignmentNode"}}, "F13": {"node_id": "F13", "node_type": "PROCESS", "label": "Set givenNum to givenNum minus 1", "line": 14, "data": {"ast_kind": "AssignmentNode"}}, "F14": {"node_id": "F14", "node_type": "OUTPUT", "label": "Display \"Factoral = {total}\"", "line": 16, "data": {"ast_kind": "OutputNode"}}}, "edges": [{"source": "F7", "target": "F8", "label": "NEXT"}, {"source": "F6", "target": "F7", "label": "TRY"}, {"source": "F6", "target": "F9", "label": "EXCEPTION"}, {"source": "F5", "target": "F6", "label": "NEXT"}, {"source": "F4", "target": "F5", "label": "TRUE"}, {"source": "F8", "target": "F4", "label": "LOOP"}, {"source": "F9", "target": "F4", "label": "LOOP"}, {"source": "F3", "target": "F4", "label": "NEXT"}, {"source": "F4", "target": "F10", "label": "NEXT"}, {"source": "F12", "target": "F13", "label": "NEXT"}, {"source": "F11", "target": "F12", "label": "TRUE"}, {"source": "F13", "target": "F11", "label": "LOOP"}, {"source": "F10", "target": "F11", "label": "NEXT"}, {"source": "F11", "target": "F14", "label": "NEXT"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F14", "target": "F2", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "AssignmentNode", "line": 1, "target": {"kind": "IdentifierNode", "line": 1, "name": "loop"}, "value": {"kind": "LiteralNode", "line": 1, "value": true, "data_type": "BOOLEAN"}}, {"kind": "WhileNode", "line": 2, "condition": {"kind": "BinaryNode", "line": 2, "operator": "==", "left": {"kind": "IdentifierNode", "line": 2, "name": "loop"}, "right": {"kind": "LiteralNode", "line": 2, "value": true, "data_type": "BOOLEAN"}}, "body": {"kind": "BlockNode", "line": 3, "statements": [{"kind": "AssignmentNode", "line": 3, "target": {"kind": "IdentifierNode", "line": 3, "name": "givenNum"}, "value": {"kind": "InputNode", "line": 3, "prompt": {"kind": "LiteralNode", "line": 3, "value": "Enter Number: ", "data_type": "STRING"}}}, {"kind": "TryCatchNode", "line": 4, "try_body": {"kind": "BlockNode", "line": 5, "statements": [{"kind": "AssignmentNode", "line": 5, "target": {"kind": "IdentifierNode", "line": 5, "name": "givenNum"}, "value": {"kind": "CastNode", "line": 5, "target_type": "INTEGER", "expression": {"kind": "IdentifierNode", "line": 5, "name": "givenNum"}}}, {"kind": "AssignmentNode", "line": 6, "target": {"kind": "IdentifierNode", "line": 6, "name": "loop"}, "value": {"kind": "LiteralNode", "line": 6, "value": false, "data_type": "BOOLEAN"}}]}, "error": null, "catch_body": {"kind": "BlockNode", "line": 8, "statements": [{"kind": "OutputNode", "line": 8, "expression": {"kind": "LiteralNode", "line": 8, "value": "That's Not an Integer, Please Try Again!", "data_type": "STRING"}}]}}]}}, {"kind": "AssignmentNode", "line": 11, "target": {"kind": "IdentifierNode", "line": 11, "name": "total"}, "value": {"kind": "LiteralNode", "line": 11, "value": 1, "data_type": "INTEGER"}}, {"kind": "WhileNode", "line": 12, "condition": {"kind": "BinaryNode", "line": 12, "operator": ">", "left": {"kind": "IdentifierNode", "line": 12, "name": "givenNum"}, "right": {"kind": "LiteralNode", "line": 12, "value": 0, "data_type": "INTEGER"}}, "body": {"kind": "BlockNode", "line": 13, "statements": [{"kind": "AssignmentNode", "line": 13, "target": {"kind": "IdentifierNode", "line": 13, "name": "total"}, "value": {"kind": "BinaryNode", "line": 13, "operator": "*", "left": {"kind": "IdentifierNode", "line": 13, "name": "total"}, "right": {"kind": "IdentifierNode", "line": 13, "name": "givenNum"}}}, {"kind": "AssignmentNode", "line": 14, "target": {"kind": "IdentifierNode", "line": 14, "name": "givenNum"}, "value": {"kind": "BinaryNode", "line": 14, "operator": "-", "left": {"kind": "IdentifierNode", "line": 14, "name": "givenNum"}, "right": {"kind": "LiteralNode", "line": 14, "value": 1, "data_type": "INTEGER"}}}]}}, {"kind": "OutputNode", "line": 16, "expression": {"kind": "LiteralNode", "line": 16, "value": "Factoral = {total}", "data_type": "STRING"}}]}};
const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>
</body>
</html>
