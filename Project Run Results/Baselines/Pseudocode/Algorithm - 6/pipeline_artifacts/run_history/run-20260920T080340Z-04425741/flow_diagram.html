<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL-FDEP Flow Diagram</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>
<header>

<p>Standard flowchart notation generated from AJ pseudocode.</p>

<button id="zoom-in" type="button">Zoom in</button>
<button id="zoom-out" type="button">Zoom out</button>
<button id="fit" type="button">Fit diagram</button>
</div>
</header>

</marker>

5</text></g><g class="flow-node" data-node-id="F6"><title>PROCESS | Line 4 | F6</title><rect class="shape" x="265.0" y="878" width="230" height="64" rx="4" ry="4"></rect><text x="380.0" y="903.0"><tspan x="380.0" dy="0">Append character to string2</tspan></text><text class="metadata" x="380.0" y="929">Line 4 · F6</text></g><g class="flow-node" data-node-id="F7"><title>PROCESS | Line 6 | F7</title><rect class="shape" x="615.0" y="878" width="230" height="64" rx="4" ry="4"></rect><text x="730.0" y="903.0"><tspan x="730.0" dy="0">Set flag to true</tspan></text><text class="metadata" x="730.0" y="929">Line 6 · F7</text></g><g class="flow-node" data-node-id="F8"><title>PROCESS | Line 7 | F8</title><rect class="shape" x="440.0" y="1075" width="230" height="64" rx="4" ry="4"></rect><text x="555.0" y="1100.0"><tspan x="555.0" dy="0">Set count to 0</tspan></text><text class="metadata" x="555.0" y="1126">Line 7 · F8</text></g><g class="flow-node" data-node-id="F9"><title>LOOP_DECISION | Line 8 | F9</title><polygon class="shape" points="555.0,1272 670.0,1328.0 555.0,1384 440.0,1328.0"></polygon><text x="555.0" y="1321.0"><tspan x="555.0" dy="0">Continue while flag?</tspan></text><text class="metadata" x="555.0" y="1371">Line 8 · F9</text></g><g class="flow-node" data-node-id="F10"><title>TRY | Line 9 | F10</title><rect class="shape" x="265.0" y="1469" width="230" height="64" rx="4" ry="4"></rect><text x="380.0" y="1486.0"><tspan x="380.0" dy="0">Attempt the following</tspan><tspan x="380.0" dy="16">operations</tspan></text><text class="metadata" x="380.0" y="1520">Line 9 · F10</text></g><g class="flow-node" data-node-id="F11"><title>PROCESS | Line 10 | F11</title><rect class="shape" x="440.0" y="1666" width="230" height="64" rx="4" ry="4"></rect><text x="555.0" y="1683.0"><tspan x="555.0" dy="0">Set element to the result of</tspan><tspan x="555.0" dy="16">string2.pop(0)</tspan></text><text class="metadata" x="555.0" y="1717">Line 10 · F11</text></g><g class="flow-node" data-no </svg>
</div>
<div class="legend">Oval: Start/End<br>Diamond: Decision<br>Parallelogram: Input/Output<br>Rectangle: Process<br>Double rectangle: Function/Call</div>
<script>
const diagramData = {"format": "NL-FDEP Flow Diagram", "version": "1.0", "entry_node": "F1", "exit_node": "F2", "nodes": {"F1": {"node_id": "F1", "node_type": "START", "label": "Start", "line": 1, "data": {}}, "F2": {"node_id": "F2", "node_type": "END", "label": "End", "line": 1, "data": {}}, "F3": {"node_id": "F3", "node_type": "PROCESS", "label": "Set string1 to \"This /_@!^*%<>is &*;:'a sentence, that has unwanted punctuation!\"", "line": 1, "data": {"ast_kind": "AssignmentNode"}}, "F4": {"node_id": "F4", "node_type": "PROCESS", "label": "Set string2 to an empty list", "line": 2, "data": {"ast_kind": "AssignmentNode"}}, "F5": {"node_id": "F5", "node_type": "LOOP_DECISION", "label": "For each character in string1", "line": 3, "data": {"ast_kind": "ForEachNode"}}, "F6": {"node_id": "F6", "node_type": "PROCESS", "label": "Append character to string2", "line": 4, "data": {"ast_kind": "AppendNode"}}, "F7": {"node_id": "F7", "node_type": "PROCESS", "label": "Set flag to true", "line": 6, "data": {"ast_kind": "AssignmentNode"}}, "F8": {"node_id": "F8", "node_type": "PROCESS", "label": "Set count to 0", "line": 7, "data": {"ast_kind": "AssignmentNode"}}, "F9": {"node_id": "F9", "node_type": "LOOP_DECISION", "label": "Continue while flag?", "line": 8, "data": {"ast_kind": "WhileNode"}}, "F10": {"node_id": "F10", "node_type": "TRY", "label": "Attempt the following operations", "line": 9, "data": {"ast_kind": "TryCatchNode"}}, "F11": {"node_id": "F11", "node_type": "PROCESS", "label": "Set element to the result of string2.pop(0)", "line": 10, "data": {"ast_kind": "AssignmentNode"}}, "F12": {"node_id": "F12", "node_type": "PROCESS", "label": "Set count to count plus 1", "line": 11, "data": {"ast_kind": "AssignmentNode"}}, "F13": {"node_id": "F13", "node_type": "PROCESS", "label": "Set flag to false", "line": 13, "data": {"ast_kind": "AssignmentNode"}}, "F14": {"node_id": "F14", "node_type": "OUTPUT", "label": "Display \"String Length = {count} Characters\"", "line": 16, "data": {"ast_kind": "OutputNode"}}}, "edges": [{"source": "F3", "target": "F4", "label": "NEXT"}, {"source": "F5", "target": "F6", "label": "ITERATE"}, {"source": "F6", "target": "F5", "label": "LOOP"}, {"source": "F4", "target": "F5", "label": "NEXT"}, {"source": "F5", "target": "F7", "label": "NEXT"}, {"source": "F7", "target": "F8", "label": "NEXT"}, {"source": "F11", "target": "F12", "label": "NEXT"}, {"source": "F10", "target": "F11", "label": "TRY"}, {"source": "F10", "target": "F13", "label": "EXCEPTION"}, {"source": "F9", "target": "F10", "label": "TRUE"}, {"source": "F12", "target": "F9", "label": "LOOP"}, {"source": "F13", "target": "F9", "label": "LOOP"}, {"source": "F8", "target": "F9", "label": "NEXT"}, {"source": "F9", "target": "F14", "label": "NEXT"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F14", "target": "F2", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "AssignmentNode", "line": 1, "target": {"kind": "IdentifierNode", "line": 1, "name": "string1"}, "value": {"kind": "LiteralNode", "line": 1, "value": "This /_@!^*%<>is &*;:'a sentence, that has unwanted punctuation!", "data_type": "STRING"}}, {"kind": "AssignmentNode", "line": 2, "target": {"kind": "IdentifierNode", "line": 2, "name": "string2"}, "value": {"kind": "EmptyLiteralNode", "line": 2, "empty_type": "LIST"}}, {"kind": "ForEachNode", "line": 3, "variable": {"kind": "IdentifierNode", "line": 3, "name": "character"}, "collection": {"kind": "IdentifierNode", "line": 3, "name": "string1"}, "body": {"kind": "BlockNode", "line": 4, "statements": [{"kind": "AppendNode", "line": 4, "value": {"kind": "IdentifierNode", "line": 4, "name": "character"}, "collection": {"kind": "IdentifierNode", "line": 4, "name": "string2"}}]}}, {"kind": "AssignmentNode", "line": 6, "target": {"kind": "IdentifierNode", "line": 6, "name": "flag"}, "value": {"kind": "LiteralNode", "line": 6, "value": true, "data_type": "BOOLEAN"}}, {"kind": "AssignmentNode", "line": 7, "target": {"kind": "IdentifierNode", "line": 7, "name": "count"}, "value": {"kind": "LiteralNode", "line": 7, "value": 0, "data_type": "INTEGER"}}, {"kind": "WhileNode", "line": 8, "condition": {"kind": "IdentifierNode", "line": 8, "name": "flag"}, "body": {"kind": "BlockNode", "line": 9, "statements": [{"kind": "TryCatchNode", "line": 9, "try_body": {"kind": "BlockNode", "line": 10, "statements": [{"kind": "AssignmentNode", "line": 10, "target": {"kind": "IdentifierNode", "line": 10, "name": "element"}, "value": {"kind": "MemberCallNode", "line": 10, "object": {"kind": "IdentifierNode", "line": 10, "name": "string2"}, "member": "pop", "arguments": [{"kind": "LiteralNode", "line": 10, "value": 0, "data_type": "INTEGER"}], "resolved_intrinsic": null}}, {"kind": "AssignmentNode", "line": 11, "target": {"kind": "IdentifierNode", "line": 11, "name": "count"}, "value": {"kind": "BinaryNode", "line": 11, "operator": "+", "left": {"kind": "IdentifierNode", "line": 11, "name": "count"}, "right": {"kind": "LiteralNode", "line": 11, "value": 1, "data_type": "INTEGER"}}}]}, "error": null, "catch_body": {"kind": "BlockNode", "line": 13, "statements": [{"kind": "AssignmentNode", "line": 13, "target": {"kind": "IdentifierNode", "line": 13, "name": "flag"}, "value": {"kind": "LiteralNode", "line": 13, "value": false, "data_type": "BOOLEAN"}}]}}]}}, {"kind": "OutputNode", "line": 16, "expression": {"kind": "LiteralNode", "line": 16, "value": "String Length = {count} Characters", "data_type": "STRING"}}]}};
const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>
</body>
</html>
