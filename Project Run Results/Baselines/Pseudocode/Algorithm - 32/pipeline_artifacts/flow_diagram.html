.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }

st with brooms, then with dusters; then on ladders and steps and chairs, with a brush and a pail of whitewash; till he had dust in his throat and eyes, and splashes of whitewash all over his black fur, and an overall spring-feeling in his air and heart. Spring was moving in the air above and in the earth below and around him, penetrating even his dark and lowly little house with its spirit of divine discontent and longing. It was small wonder, then, that he suddenly flung his brush on the floor, said 'Bother!' and 'O blow!' and also 'Hang spring-cleaning!' and bolted out of the house. He scraped and scratched and scrabbled and poked, working his little way up through the soft earth, till at last, pop! his nose came out into the sunlight, and he found himself rolling in the warm grass of a great meadow. 'This is fine!' he said to himself. 'This is better than whitewash!'. The sunshine struck hot on his fur, the soft breezes caressed his heated brow, and after the lonely very long time he had spent in his underground home, he felt his heart leap up with joy. He scrambled out of the hole, set off across the meadow, and wandered aimlessly towards the trees and the sparkling water in the distance. He had never seen a river before. It was a sleek, full-bodied animal, chasing and chuckling, gripping things with a gurgling voice, laughing and leaping. It was an otter, a badger, or a water-rat\u2014 though he did not know it at the time. He sat on the bank, fascinated by the sight, until he saw a dark hole in the opposite bank right above the water, with a comfortable-looking chair, and fishing poles sticking out. As he sat looking at it, a tiny, bright-eyed face appeared and vanished, then reappeared again. It was the Water Rat. The Rat looked at the Mole, and the Mole looked at the Rat. 'Hullo, Mole!' said the Water Rat. 'Hullo, Rat!' said the Mole. 'Would you like to come over?' enquired the Rat presently. 'Oh, it's all very well to say come over,' replied the Mole, who was a stranger to the river, and rather bewildered. The Rat stepped into a little boat which the Mole had not observed. It was painted blue outside and white within, and looked as neat as a new watch. He sculled across with easy, practiced strokes, and held out a paw as the Mole stepped in. 'It's a wonderful life!' said the Rat. 'There is nothing\u2014absolutely nothing\u2014half so much worth doing as simply messing about in boats.'", "data_type": "STRING"}}, {"kind": "AssignmentNode", "line": 33, "target": {"kind": "IdentifierNode", "line": 33, "name": "text"}, "value": {"kind": "CallNode", "line": 33, "name": "clean_text", "arguments": [{"kind": "IdentifierNode", "line": 33, "name": "raw_text"}]}}, {"kind": "AssignmentNode", "line": 34, "target": {"kind": "IdentifierNode", "line": 34, "name": "question"}, "value": {"kind": "InputNode", "line": 34, "prompt": {"kind": "LiteralNode", "line": 34, "value": "Enter your question:\n", "data_type": "STRING"}}}, {"kind": "FunctionNode", "line": 36, "name": "split_sentences", "parameters": [{"kind": "ParameterNode", "line": 36, "name": "text", "declared_type": null}], "body": {"kind": "BlockNode", "line": 37, "statements": [{"kind": "AssignmentNode", "line": 37, "target": {"kind": "IdentifierNode", "line": 37, "name": "temp"}, "value": {"kind": "MemberCallNode", "line": 37, "object": {"kind": "MemberCallNode", "line": 37, "object": {"kind": "IdentifierNode", "line": 37, "name": "text"}, "member": "replace", "arguments": [{"kind": "LiteralNode", "line": 37, "value": "?", "data_type": "STRING"}, {"kind": "LiteralNode", "line": 37, "value": ".", "data_type": "STRING"}], "resolved_intrinsic": null}, "member": "replace", "arguments": [{"kind": "LiteralNode", "line": 37, "value": "!", "data_type": "STRING"}, {"kind": "LiteralNode", "line": 37, "value": ".", "data_type": "STRING"}], "resolved_intrinsic": null}}, {"kind": "AssignmentNode", "line": 38, "target": {"kind": "IdentifierNode", "line": 38, "name": "parts"}, "value": {"kind const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>
</body>
</html>
