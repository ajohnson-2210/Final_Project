<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL-FDEP Flow Diagram</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>

<p>Standard flowchart notation generated from AJ pseudocode.</p>

nts="464.0,1075 670.0,1075 646.0,1139 440.0,1139"></polygon><text x="555.0" y="1100.0"><tspan x="555.0" dy="0">Display &quot;{givenNum} is Even&quot;</tspan></text><text class="metadata" x="555.0" y="1126">Line 13 · F12</text></g><g class="flow-node" data-node-id="F13"><title>OUTPUT | Line 15 | F13</title><polygon class="shape" points="814.0,1075 1020.0,1075 996.0,1139 790.0,1139"></polygon><text x="905.0" y="1100.0"><tspan x="905.0" dy="0">Display &quot;{givenNum} is Odd&quot;</tspan></text><text class="metadata" x="905.0" y="1126">Line 15 · F13</text></g></g>

</div>
<div class="legend">Oval: Start/End<br>Diamond: Decision<br>Parallelogram: Input/Output<br>Rectangle: Process<br>Double rectangle: Function/Call</div>
<script>
const diagramData = {"format": "NL-FDEP Flow Diagram", "version": "1.0", "entry_node": "F1", "exit_node": "F2", "nodes": {"F1": {"node_id": "F1", "node_type": "START", "label": "Start", "line": 1, "data": {}}, "F2": {"node_id": "F2", "node_type": "END", "label": "End", "line": 1, "data": {}}, "F3": {"node_id": "F3", "node_type": "PROCESS", "label": "Set givenNum to 0", "line": 1, "data": {"ast_kind": "AssignmentNode"}}, "F4": {"node_id": "F4", "node_type": "PROCESS", "label": "Set loop to true", "line": 2, "data": {"ast_kind": "AssignmentNode"}}, "F5": {"node_id": "F5", "node_type": "LOOP_DECISION", "label": "Loop is equal to true?", "line": 3, "data": {"ast_kind": "WhileNode"}}, "F6": {"node_id": "F6", "node_type": "PROCESS", "label": "Set givenNum to input prompted by \"Enter Number: \"", "line": 4, "data": {"ast_kind": "AssignmentNode"}}, "F7": {"node_id": "F7", "node_type": "TRY", "label": "Attempt the following operations", "line": 5, "data": {"ast_kind": "TryCatchNode"}}, "F8": {"node_id": "F8", "node_type": "PROCESS", "label": "Set givenNum to givenNum converted to integer", "line": 6, "data": {"ast_kind": "AssignmentNode"}}, "F9": {"node_id": "F9", "node_type": "PROCESS", "label": "Set loop to false", "line": 7, "data": {"ast_kind": "AssignmentNode"}}, "F10": {"node_id": "F10", "node_type": "OUTPUT", "label": "Display \"That's Not a Valid Integer, Please Try Again!\"", "line": 9, "data": {"ast_kind": "OutputNode"}}, "F11": {"node_id": "F11", "node_type": "DECISION", "label": "GivenNum modulo 2 is equal to 0?", "line": 12, "data": {"ast_kind": "IfNode"}}, "F12": {"node_id": "F12", "node_type": "OUTPUT", "label": "Display \"{givenNum} is Even\"", "line": 13, "data": {"ast_kind": "OutputNode"}}, "F13": {"node_id": "F13", "node_type": "OUTPUT", "label": "Display \"{givenNum} is Odd\"", "line": 15, "data": {"ast_kind": "OutputNode"}}}, "edges": [{"source": "F3", "target": "F4", "label": "NEXT"}, {"source": "F8", "target": "F9", "label": "NEXT"}, {"source": "F7", "target": "F8", "label": "TRY"}, {"source": "F7", "target": "F10", "label": "EXCEPTION"}, {"source": "F6", "target": "F7", "label": "NEXT"}, {"source": "F5", "target": "F6", "label": "TRUE"}, {"source": "F9", "target": "F5", "label": "LOOP"}, {"source": "F10", "target": "F5", "label": "LOOP"}, {"source": "F4", "target": "F5", "label": "NEXT"}, {"source": "F11", "target": "F12", "label": "TRUE"}, {"source": "F11", "target": "F13", "label": "FALSE"}, {"source": "F5", "target": "F11", "label": "NEXT"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F12", "target": "F2", "label": "NEXT"}, {"source": "F13", "target": "F2", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "AssignmentNode", "line": 1, "target": {"kind": "IdentifierNode", "line": 1, "name": "givenNum"}, "value": {"kind": "LiteralNode", "line": 1, "value": 0, "data_type": "INTEGER"}}, {"kind": "AssignmentNode", "line": 2, "target": {"kind": "IdentifierNode", "line": 2, "name": "loop"}, "value": {"kind": "LiteralNode", "line": 2, "value": true, "data_type": "BOOLEAN"}}, {"kind": "WhileNode", "line": 3, "condition": {"kind": "BinaryNode", "line": 3, "operator": "==", "left": {"kind": "IdentifierNode", "line": 3, "name": "loop"}, "right": {"kind": "LiteralNode", "line": 3, "value": true, "data_type": "BOOLEAN"}}, "body": {"kind": "BlockNode", "line": 4, "statements": [{"kind": "AssignmentNode", "line": 4, "target": {"kind": "IdentifierNode", "line": 4, "name": "givenNum"}, "value": {"kind": "InputNode", "line": 4, "prompt": {"kind": "LiteralNode", "line": 4, "value": "Enter Number: ", "data_type": "STRING"}}}, {"kind": "TryCatchNode", "line": 5, "try_body": {"kind": "BlockNode", "line": 6, "statements": [{"kind": "AssignmentNode", "line": 6, "target": {"kind": "IdentifierNode", "line": 6, "name": "givenNum"}, "value": {"kind": "CastNode", "line": 6, "target_type": "INTEGER", "expression": {"kind": "IdentifierNode", "line": 6, "name": "givenNum"}}}, {"kind": "AssignmentNode", "line": 7, "target": {"kind": "IdentifierNode", "line": 7, "name": "loop"}, "value": {"kind": "LiteralNode", "line": 7, "value": false, "data_type": "BOOLEAN"}}]}, "error": null, "catch_body": {"kind": "BlockNode", "line": 9, "statements": [{"kind": "OutputNode", "line": 9, "expression": {"kind": "LiteralNode", "line": 9, "value": "That's Not a Valid Integer, Please Try Again!", "data_type": "STRING"}}]}}]}}, {"kind": "IfNode", "line": 12, "condition": {"kind": "BinaryNode", "line": 12, "operator": "==", "left": {"kind": "BinaryNode", "line": 12, "operator": "MODULUS", "left": {"kind": "IdentifierNode", "line": 12, "name": "givenNum"}, "right": {"kind": "LiteralNode", "line": 12, "value": 2, "data_type": "INTEGER"}}, "right": {"kind": "LiteralNode", "line": 12, "value": 0, "data_type": "INTEGER"}}, "then_body": {"kind": "BlockNode", "line": 13, "statements": [{"kind": "OutputNode", "line": 13, "expression": {"kind": "LiteralNode", "line": 13, "value": "{givenNum} is Even", "data_type": "STRING"}}]}, "else_if": [], "else_body": {"kind": "BlockNode", "line": 15, "statements": [{"kind": "OutputNode", "line": 15, "expression": {"kind": "LiteralNode", "line": 15, "value": "{givenNum} is Odd", "data_type": "STRING"}}]}}]}};
const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>

</html>
