<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL-FDEP Flow Diagram</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>

<p>Standard flowchart notation generated from AJ pseudocode.</p>

<button id="zoom-in" type="button">Zoom in</button>
<button id="zoom-out" type="button">Zoom out</button>
<button id="fit" type="button">Fit diagram</button>
</div>
</header>

" x="790.0" y="5803" width="230" height="64" rx="32" ry="32"></rect><text x="905.0" y="5828.0"><tspan x="905.0" dy="0">End</tspan></text><text class="metadata" x="905.0" y="5854">Line 1 · F2</text></g><g class="flow-node" data-node-id="F3"><title>PROCESS | Line 1 | F3</title><rect class="shape" x="440.0" y="287" width="230" height="64" rx="4" ry="4"></rect><text x="555.0" y="296.0"><tspan x="555.0" dy="0">Set __reserved_keyword__list</tspan><tspan x="555.0" dy="16">to [6, 7, 9, 4, 66, 8, 34, 5,</tspan><tspan x="555.0" dy="16">2]</tspan></text><text class="metadata" x="555.0" y="338">Line 1 · F3</text></g><g class="flow-node" data-node-id="F4"><title>PROCESS | Line 2 | F4</title><rect class="shape" x="440.0" y="484" width="230" height="64" rx="4" ry="4"></rect><text x="555.0" y="509.0"><tspan x="555.0" dy="0">Set total to 0</tspan></text><text class="metadata" x="555.0" y="535">Line 2 · F4</text></g><g class="flow-node" data-node-id="F5"><title>LOOP_DECISION | Line 3 | F5</title><polygon class="shape" points="555.0,6000 670.0,6056.0 555.0,6112 440.0,6056.0"></polygon><text x="555.0" y="6041.0"><tspan x="555.0" dy="0">For i from 0 to the length of</tspan><tspan x="555.0" dy="16">__reserved_keyword__list</tspan></text><text class="metadata" x="555.0" y="6099">Line 3 · F5</text></g><g class="flow-node" data-node-id="F6"><title>DECISION | Line 4 | F6</title><polygon class="shape" points="380.0,5606 495.0,5662.0 380.0,5718 265.0,5662.0"></polygon><text x="380.0" y="5639.0"><tspan x="380.0" dy="0">Item i of</tspan><tspan x="380.0" dy="16">__reserved_keyword__list</tspan><tspan x="380.0" dy="16">modulo 2 is equal to 0?</tspan></text><text class="metadata" x="380.0" y="5705">Line 4 · F6</text></g><g class="flow-node" data-node-id="F7"><title>PROCESS | Line 5 | F7</title><rect class="shape" x="90.0" y="5803" width="230" height="64" rx="4" ry="4"></rect><text x="205.0" y="5820.0"><tspan x="205.0" dy="0">Set total to total plus item i</tspan><tspan x="205.0" dy="16">of __reserved_keyword__list</tspan></text><text class="metadata" x="205.0" y="5854">Line 5 · F7</text></g><g class="flow-node" data-node-id="F8"><title>CONTINUE | Line 7 | F8</title><rect class="shape" x="440.0" y="5803" width="230" height="64" rx="4" ry="4"></rect><text x="555.0" y="5820.0"><tspan x="555.0" dy="0">Continue with the next loop</tspan><tspan x="555.0" dy="16">iteration</tspan></text><text class="metadata" x="555.0" y="5854">Line 7 · F8</text></g><g class="flow-node" data-node-id="F9"><title>OUTPUT | Line 10 | F9</title><polygon class="shape" points="639.0,5606 845.0,5606 821.0,5670 615.0,5670"></polygon><text x="730.0" y="5623.0"><tspan x="730.0" dy="0">Display &quot;The Sum of Even list</tspan><tspan x="730.0" dy="16">elements = {total}&quot;</tspan></text><text class="metadata" x="730.0" y="5657">Line 10 · F9</text></g></g>
</svg>
</div>
<div class="legend">Oval: Start/End<br>Diamond: Decision<br>Parallelogram: Input/Output<br>Rectangle: Process<br>Double rectangle: Function/Call</div>
<script>
const diagramData = {"format": "NL-FDEP Flow Diagram", "version": "1.0", "entry_node": "F1", "exit_node": "F2", "nodes": {"F1": {"node_id": "F1", "node_type": "START", "label": "Start", "line": 1, "data": {}}, "F2": {"node_id": "F2", "node_type": "END", "label": "End", "line": 1, "data": {}}, "F3": {"node_id": "F3", "node_type": "PROCESS", "label": "Set __reserved_keyword__list to [6, 7, 9, 4, 66, 8, 34, 5, 2]", "line": 1, "data": {"ast_kind": "AssignmentNode"}}, "F4": {"node_id": "F4", "node_type": "PROCESS", "label": "Set total to 0", "line": 2, "data": {"ast_kind": "AssignmentNode"}}, "F5": {"node_id": "F5", "node_type": "LOOP_DECISION", "label": "For i from 0 to the length of __reserved_keyword__list", "line": 3, "data": {"ast_kind": "ForRangeNode"}}, "F6": {"node_id": "F6", "node_type": "DECISION", "label": "Item i of __reserved_keyword__list modulo 2 is equal to 0?", "line": 4, "data": {"ast_kind": "IfNode"}}, "F7": {"node_id": "F7", "node_type": "PROCESS", "label": "Set total to total plus item i of __reserved_keyword__list", "line": 5, "data": {"ast_kind": "AssignmentNode"}}, "F8": {"node_id": "F8", "node_type": "CONTINUE", "label": "Continue with the next loop iteration", "line": 7, "data": {"ast_kind": "ContinueNode"}}, "F9": {"node_id": "F9", "node_type": "OUTPUT", "label": "Display \"The Sum of Even list elements = {total}\"", "line": 10, "data": {"ast_kind": "OutputNode"}}}, "edges": [{"source": "F3", "target": "F4", "label": "NEXT"}, {"source": "F6", "target": "F7", "label": "TRUE"}, {"source": "F6", "target": "F8", "label": "FALSE"}, {"source": "F5", "target": "F6", "label": "ITERATE"}, {"source": "F8", "target": "F5", "label": "CONTINUE"}, {"source": "F7", "target": "F5", "label": "LOOP"}, {"source": "F4", "target": "F5", "label": "NEXT"}, {"source": "F5", "target": "F9", "label": "NEXT"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F9", "target": "F2", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "AssignmentNode", "line": 1, "target": {"kind": "IdentifierNode", "line": 1, "name": "__reserved_keyword__list"}, "value": {"kind": "ListLiteralNode", "line": 1, "items": [{"kind": "LiteralNode", "line": 1, "value": 6, "data_type": "INTEGER"}, {"kind": "LiteralNode", "line": 1, "value": 7, "data_type": "INTEGER"}, {"kind": "LiteralNode", "line": 1, "value": 9, "data_type": "INTEGER"}, {"kind": "LiteralNode", "line": 1, "value": 4, "data_type": "INTEGER"}, {"kind": "LiteralNode", "line": 1, "value": 66, "data_type": "INTEGER"}, {"kind": "LiteralNode", "line": 1, "value": 8, "data_type": "INTEGER"}, {"kind": "LiteralNode", "line": 1, "value": 34, "data_type": "INTEGER"}, {"kind": "LiteralNode", "line": 1, "value": 5, "data_type": "INTEGER"}, {"kind": "LiteralNode", "line": 1, "value": 2, "data_type": "INTEGER"}], "declared_type": null}}, {"kind": "AssignmentNode", "line": 2, "target": {"kind": "IdentifierNode", "line": 2, "name": "total"}, "value": {"kind": "LiteralNode", "line": 2, "value": 0, "data_type": "INTEGER"}}, {"kind": "ForRangeNode", "line": 3, "variable": {"kind": "IdentifierNode", "line": 3, "name": "i"}, "start": {"kind": "LiteralNode", "line": 3, "value": 0, "data_type": "INTEGER"}, "end": {"kind": "LengthNode", "line": 3, "expression": {"kind": "IdentifierNode", "line": 3, "name": "__reserved_keyword__list"}}, "step": null, "body": {"kind": "BlockNode", "line": 4, "statements": [{"kind": "IfNode", "line": 4, "condition": {"kind": "BinaryNode", "line": 4, "operator": "==", "left": {"kind": "BinaryNode", "line": 4, "operator": "MODULUS", "left": {"kind": "IndexNode", "line": 4, "collection": {"kind": "IdentifierNode", "line": 4, "name": "__reserved_keyword__list"}, "index": {"kind": "IdentifierNode", "line": 4, "name": "i"}}, "right": {"kind": "LiteralNode", "line": 4, "value": 2, "data_type": "INTEGER"}}, "right": {"kind": "LiteralNode", "line": 4, "value": 0, "data_type": "INTEGER"}}, "then_body": {"kind": "BlockNode", "line": 5, "statements": [{"kind": "AssignmentNode", "line": 5, "target": {"kind": "IdentifierNode", "line": 5, "name": "total"}, "value": {"kind": "BinaryNode", "line": 5, "operator": "+", "left": {"kind": "IdentifierNode", "line": 5, "name": "total"}, "right": {"kind": "IndexNode", "line": 5, "collection": {"kind": "IdentifierNode", "line": 5, "name": "__reserved_keyword__list"}, "index": {"kind": "IdentifierNode", "line": 5, "name": "i"}}}}]}, "else_if": [], "else_body": {"kind": "BlockNode", "line": 7, "statements": [{"kind": "ContinueNode", "line": 7}]}}]}}, {"kind": "OutputNode", "line": 10, "expression": {"kind": "LiteralNode", "line": 10, "value": "The Sum of Even list elements = {total}", "data_type": "STRING"}}]}};
const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>
</body>
</html>
