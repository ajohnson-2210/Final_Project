<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL-FDEP Flow Diagram</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.shared-return-follower { marker-end: none; }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>
<header>

<p>Standard flowchart notation generated from AJ pseudocode.</p>

</div>
</header>

</marker>

ne 14 | F11</title><rect class="shape" x="440.0" y="1075" width="230" height="64" rx="4" ry="4"></rect><text x="555.0" y="1100.0"><tspan x="555.0" dy="0">Return C</tspan></text><text class="metadata" x="555.0" y="1126">Line 14 · F11</text></g></g>

</div>

e": "F9", "target": "F8", "label": "LOOP"}, {"source": "F7", "target": "F8", "label": "ITERATE"}, {"source": "F8", "target": "F7", "label": "LOOP"}, {"source": "F6", "target": "F7", "label": "NEXT"}, {"source": "F7", "target": "F11", "label": "NEXT"}, {"source": "F3", "target": "F4", "label": "BODY"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F5", "target": "F2", "label": "NEXT"}, {"source": "F11", "target": "F2", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "FunctionNode", "line": 1, "name": "MultiplyMatrices", "parameters": [{"kind": "ParameterNode", "line": 1, "name": "A", "declared_type": null}, {"kind": "ParameterNode", "line": 1, "name": "B", "declared_type": null}, {"kind": "ParameterNode", "line": 1, "name": "r1", "declared_type": null}, {"kind": "ParameterNode", "line": 1, "name": "c1", "declared_type": null}, {"kind": "ParameterNode", "line": 1, "name": "r2", "declared_type": null}, {"kind": "ParameterNode", "line": 1, "name": "c2", "declared_type": null}], "body": {"kind": "BlockNode", "line": 2, "statements": [{"kind": "IfNode", "line": 2, "condition": {"kind": "BinaryNode", "line": 2, "operator": "!=", "left": {"kind": "IdentifierNode", "line": 2, "name": "c1"}, "right": {"kind": "IdentifierNode", "line": 2, "name": "r2"}}, "then_body": {"kind": "BlockNode", "line": 3, "statements": [{"kind": "ReturnNode", "line": 3, "expression": {"kind": "LiteralNode", "line": 3, "value": "Invalid matrix dimensions", "data_type": "STRING"}}]}, "else_if": [], "else_body": null}, {"kind": "AssignmentNode", "line": 6, "target": {"kind": "IdentifierNode", "line": 6, "name": "C"}, "value": {"kind": "CallNode", "line": 6, "name": "create_matrix", "arguments": [{"kind": "IdentifierNode", "line": 6, "name": "r1"}, {"kind": "IdentifierNode", "line": 6, "name": "c2"}, {"kind": "LiteralNode", "line": 6, "value": 0, "data_type": "INTEGER"}]}}, {"kind": "ForRangeNode", "line": 7, "variable": {"kind": "IdentifierNode", "line": 7, "name": "i"}, "start": {"kind": "LiteralNode", "line": 7, "value": 0, "data_type": "INTEGER"}, "end": {"kind": "BinaryNode", "line": 7, "operator": "+", "left": {"kind": "BinaryNode", "line": 7, "operator": "-", "left": {"kind": "IdentifierNode", "line": 7, "name": "r1"}, "right": {"kind": "LiteralNode", "line": 7, "value": 1, "data_type": "INTEGER"}}, "right": {"kind": "LiteralNode", "line": 7, "value": 1, "data_type": "INTEGER"}}, "step": null, "body": {"kind": "BlockNode", "line": 8, "statements": [{"kind": "ForRangeNode", "line": 8, "variable": {"kind": "IdentifierNode", "line": 8, "name": "j"}, "start": {"kind": "LiteralNode", "line": 8, "value": 0, "data_type": "INTEGER"}, "end": {"kind": "BinaryNode", "line": 8, "operator": "+", "left": {"kind": "BinaryNode", "line": 8, "operator": "-", "left": {"kind": "IdentifierNode", "line": 8, "name": "c2"}, "right": {"kind": "LiteralNode", "line": 8, "value": 1, "data_type": "INTEGER"}}, "right": {"kind": "LiteralNode", "line": 8, "value": 1, "data_type": "INTEGER"}}, "step": null, "body": {"kind": "BlockNode", "line": 9, "statements": [{"kind": "ForRangeNode", "line": 9, "variable": {"kind": "IdentifierNode", "line": 9, "name": "k"}, "start": {"kind": "LiteralNode", "line": 9, "value": 0, "data_type": "INTEGER"}, "end": {"kind": "BinaryNode", "line": 9, "operator": "+", "left": {"kind": "BinaryNode", "line": 9, "operator": "-", "left": {"kind": "IdentifierNode", "line": 9, "name": "c1"}, "right": {"kind": "LiteralNode", "line": 9, "value": 1, "data_type": "INTEGER"}}, "right": {"kind": "LiteralNode", "line": 9, "value": 1, "data_type": "INTEGER"}}, "step": null, "body": {"kind": "BlockNode", "line": 10, "statements": [{"kind": "AssignmentNode", "line": 10, "target": {"kind": "IndexNode", "line": 10, "collection": {"kind": "IndexNode", "line": 10, "collection": {"kind": "IdentifierNode", "line": 10, "name": "C"}, "index": {"kind": "IdentifierNode", "line": 10, "name": "i"}}, "index": {"kind": "Identifi const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>
</body>
</html>
