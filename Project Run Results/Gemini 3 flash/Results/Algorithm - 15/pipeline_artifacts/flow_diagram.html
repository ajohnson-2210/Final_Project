<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.shared-return-follower { marker-end: none; }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>

turn second_largest", "line": 18, "data": {"ast_kind": "ReturnNode"}}}, "edges": [{"source": "F4", "target": "F5", "label": "TRUE"}, {"source": "F4", "target": "F6", "label": "NEXT"}, {"source": "F6", "target": "F7", "label": "NEXT"}, {"source": "F10", "target": "F11", "label": "NEXT"}, {"source": "F9", "target": "F10", "label": "TRUE"}, {"source": "F9", "target": "F12", "label": "FALSE"}, {"source": "F12", "target": "F13", "label": "TRUE"}, {"source": "F8", "target": "F9", "label": "ITERATE"}, {"source": "F11", "target": "F8", "label": "LOOP"}, {"source": "F13", "target": "F8", "label": "LOOP"}, {"source": "F12", "target": "F8", "label": "LOOP"}, {"source": "F7", "target": "F8", "label": "NEXT"}, {"source": "F8", "target": "F14", "label": "NEXT"}, {"source": "F3", "target": "F4", "label": "BODY"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F5", "target": "F2", "label": "NEXT"}, {"source": "F14", "target": "F2", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "FunctionNode", "line": 1, "name": "FindSecondLargest", "parameters": [{"kind": "ParameterNode", "line": 1, "name": "arr", "declared_type": null}], "body": {"kind": "BlockNode", "line": 2, "statements": [{"kind": "IfNode", "line": 2, "condition": {"kind": "BinaryNode", "line": 2, "operator": "<", "left": {"kind": "LengthNode", "line": 2, "expression": {"kind": "IdentifierNode", "line": 2, "name": "arr"}}, "right": {"kind": "LiteralNode", "line": 2, "value": 2, "data_type": "INTEGER"}}, "then_body": {"kind": "BlockNode", "line": 3, "statements": [{"kind": "ReturnNode", "line": 3, "expression": {"kind": "IdentifierNode", "line": 3, "name": "NULL"}}]}, "else_if": [], "else_body": null}, {"kind": "AssignmentNode", "line": 6, "target": {"kind": "IdentifierNode", "line": 6, "name": "largest"}, "value": {"kind": "CallNode", "line": 6, "name": "negative_infinity", "arguments": []}}, {"kind": "AssignmentNode", "line": 7, "target": {"kind": "IdentifierNode", "line": 7, "name": "second_largest"}, "value": {"kind": "CallNode", "line": 7, "name": "negative_infinity", "arguments": []}}, {"kind": "ForEachNode", "line": 9, "variable": {"kind": "IdentifierNode", "line": 9, "name": "num"}, "collection": {"kind": "IdentifierNode", "line": 9, "name": "arr"}, "body": {"kind": "BlockNode", "line": 10, "statements": [{"kind": "IfNode", "line": 10, "condition": {"kind": "BinaryNode", "line": 10, "operator": ">", "left": {"kind": "IdentifierNode", "line": 10, "name": "num"}, "right": {"kind": "IdentifierNode", "line": 10, "name": "largest"}}, "then_body": {"kind": "BlockNode", "line": 11, "statements": [{"kind": "AssignmentNode", "line": 11, "target": {"kind": "IdentifierNode", "line": 11, "name": "second_largest"}, "value": {"kind": "IdentifierNode", "line": 11, "name": "largest"}}, {"kind": "AssignmentNode", "line": 12, "target": {"kind": "IdentifierNode", "line": 12, "name": "largest"}, "value": {"kind": "IdentifierNode", "line": 12, "name": "num"}}]}, "else_if": [{"kind": "ElseIfNode", "line": 13, "condition": {"kind": "BinaryNode", "line": 13, "operator": "AND", "left": {"kind": "BinaryNode", "line": 13, "operator": ">", "left": {"kind": "IdentifierNode", "line": 13, "name": "num"}, "right": {"kind": "IdentifierNode", "line": 13, "name": "second_largest"}}, "right": {"kind": "BinaryNode", "line": 13, "operator": "!=", "left": {"kind": "IdentifierNode", "line": 13, "name": "num"}, "right": {"kind": "IdentifierNode", "line": 13, "name": "largest"}}}, "body": {"kind": "BlockNode", "line": 14, "statements": [{"kind": "AssignmentNode", "line": 14, "target": {"kind": "IdentifierNode", "line": 14, "name": "second_largest"}, "value": {"kind": "IdentifierNode", "line": 14, "name": "num"}}]}}], "else_body": null}]}}, {"kind": "ReturnNode", "line": 18, "expression": {"kind": "IdentifierNode", "line": 18, "name": "second_largest"}}]}}]}};
const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>

</html>
