<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>NL-FDEP Flow Diagram</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.shared-return-follower { marker-end: none; }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>
</head>

</svg>
</div>
<div class="legend">Oval: Start/End<br>Diamond: Decision<br>Parallelogram: Input/Output<br>Rectangle: Process<br>Double rectangle: Function/Call</div>
<script>
const diagramData = {"format": "NL-FDEP Flow Diagram", "version": "1.0", "entry_node": "F1", "exit_node": "F2", "nodes": {"F1": {"node_id": "F1", "node_type": "START", "label": "Start", "line": 1, "data": {}}, "F2": {"node_id": "F2", "node_type": "END", "label": "End", "line": 1, "data": {}}, "F3": {"node_id": "F3", "node_type": "FUNCTION", "label": "Run function FirstNonRepeatingChar with str", "line": 1, "data": {"ast_kind": "FunctionNode", "name": "FirstNonRepeatingChar"}}, "F4": {"node_id": "F4", "node_type": "PROCESS", "label": "Set counts to an empty dictionary", "line": 2, "data": {"ast_kind": "AssignmentNode"}}, "F5": {"node_id": "F5", "node_type": "LOOP_DECISION", "label": "For each __reserved_keyword__char in str", "line": 4, "data": {"ast_kind": "ForEachNode"}}, "F6": {"node_id": "F6", "node_type": "PROCESS", "label": "Set item __reserved_keyword__char of counts to item __reserved_keyword__char of counts plus 1", "line": 5, "data": {"ast_kind": "AssignmentNode"}}, "F7": {"node_id": "F7", "node_type": "LOOP_DECISION", "label": "For each __reserved_keyword__char in str", "line": 8, "data": {"ast_kind": "ForEachNode"}}, "F8": {"node_id": "F8", "node_type": "DECISION", "label": "Item __reserved_keyword__char of counts is equal to 1?", "line": 9, "data": {"ast_kind": "IfNode"}}, "F9": {"node_id": "F9", "node_type": "RETURN", "label": "Return __reserved_keyword__char", "line": 10, "data": {"ast_kind": "ReturnNode"}}, "F10": {"node_id": "F10", "node_type": "RETURN", "label": "Return NULL", "line": 14, "data": {"ast_kind": "ReturnNode"}}}, "edges": [{"source": "F5", "target": "F6", "label": "ITERATE"}, {"source": "F6", "target": "F5", "label": "LOOP"}, {"source": "F4", "target": "F5", "label": "NEXT"}, {"source": "F8", "target": "F9", "label": "TRUE"}, {"source": "F7", "target": "F8", "label": "ITERATE"}, {"source": "F8", "target": "F7", "label": "LOOP"}, {"source": "F5", "target": "F7", "label": "NEXT"}, {"source": "F7", "target": "F10", "label": "NEXT"}, {"source": "F3", "target": "F4", "label": "BODY"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F9", "target": "F2", "label": "NEXT"}, {"source": "F10", "target": "F2", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "FunctionNode", "line": 1, "name": "FirstNonRepeatingChar", "parameters": [{"kind": "ParameterNode", "line": 1, "name": "str", "declared_type": null}], "body": {"kind": "BlockNode", "line": 2, "statements": [{"kind": "AssignmentNode", "line": 2, "target": {"kind": "IdentifierNode", "line": 2, "name": "counts"}, "value": {"kind": "EmptyLiteralNode", "line": 2, "empty_type": "DICTIONARY"}}, {"kind": "ForEachNode", "line": 4, "variable": {"kind": "IdentifierNode", "line": 4, "name": "__reserved_keyword__char"}, "collection": {"kind": "IdentifierNode", "line": 4, "name": "str"}, "body": {"kind": "BlockNode", "line": 5, "statements": [{"kind": "AssignmentNode", "line": 5, "target": {"kind": "IndexNode", "line": 5, "collection": {"kind": "IdentifierNode", "line": 5, "name": "counts"}, "index": {"kind": "IdentifierNode", "line": 5, "name": "__reserved_keyword__char"}}, "value": {"kind": "BinaryNode", "line": 5, "operator": "+", "left": {"kind": "IndexNode", "line": 5, "collection": {"kind": "IdentifierNode", "line": 5, "name": "counts"}, "index": {"kind": "IdentifierNode", "line": 5, "name": "__reserved_keyword__char"}}, "right": {"kind": "LiteralNode", "line": 5, "value": 1, "data_type": "INTEGER"}}}]}}, {"kind": "ForEachNode", "line": 8, "variable": {"kind": "IdentifierNode", "line": 8, "name": "__reserved_keyword__char"}, "collection": {"kind": "IdentifierNode", "line": 8, "name": "str"}, "body": {"kind": "BlockNode", "line": 9, "statements": [{"kind": "IfNode", "line": 9, "condition": {"kind": "BinaryNode", "line": 9, "operator": "==", "left": {"kind": "IndexNode", "line": 9, "collection": {"kind": "IdentifierNode", "line": 9, "name": "counts"}, "index": {"kind": "IdentifierNode", "line": 9, "name": "__reserved_keyword__char"}}, "right": {"kind": "LiteralNode", "line": 9, "value": 1, "data_type": "INTEGER"}}, "then_body": {"kind": "BlockNode", "line": 10, "statements": [{"kind": "ReturnNode", "line": 10, "expression": {"kind": "IdentifierNode", "line": 10, "name": "__reserved_keyword__char"}}]}, "else_if": [], "else_body": null}]}}, {"kind": "ReturnNode", "line": 14, "expression": {"kind": "IdentifierNode", "line": 14, "name": "NULL"}}]}}]}};
const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>
</body>
</html>
