<!doctype html>
<html lang="en">
<head>

<title>NL-FDEP Flow Diagram</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.shared-return-follower { marker-end: none; }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>

</div>
<div class="legend">Oval: Start/End<br>Diamond: Decision<br>Parallelogram: Input/Output<br>Rectangle: Process<br>Double rectangle: Function/Call</div>
<script>
const diagramData = {"format": "NL-FDEP Flow Diagram", "version": "1.0", "entry_node": "F1", "exit_node": "F2", "nodes": {"F1": {"node_id": "F1", "node_type": "START", "label": "Start", "line": 1, "data": {}}, "F2": {"node_id": "F2", "node_type": "END", "label": "End", "line": 1, "data": {}}, "F3": {"node_id": "F3", "node_type": "FUNCTION", "label": "Run function COUNT_VOWELS with text", "line": 1, "data": {"ast_kind": "FunctionNode", "name": "COUNT_VOWELS"}}, "F4": {"node_id": "F4", "node_type": "PROCESS", "label": "Set vowels to the result of list_value(\"a\", \"e\", \"i\", \"o\", \"u\")", "line": 2, "data": {"ast_kind": "AssignmentNode"}}, "F5": {"node_id": "F5", "node_type": "PROCESS", "label": "Set counts to an empty list", "line": 3, "data": {"ast_kind": "AssignmentNode"}}, "F6": {"node_id": "F6", "node_type": "LOOP_DECISION", "label": "For each v in vowels", "line": 4, "data": {"ast_kind": "ForEachNode"}}, "F7": {"node_id": "F7", "node_type": "PROCESS", "label": "Set count to 0", "line": 5, "data": {"ast_kind": "AssignmentNode"}}, "F8": {"node_id": "F8", "node_type": "LOOP_DECISION", "label": "For each c in text", "line": 6, "data": {"ast_kind": "ForEachNode"}}, "F9": {"node_id": "F9", "node_type": "DECISION", "label": "C is equal to v?", "line": 7, "data": {"ast_kind": "IfNode"}}, "F10": {"node_id": "F10", "node_type": "PROCESS", "label": "Set count to count plus 1", "line": 8, "data": {"ast_kind": "AssignmentNode"}}, "F11": {"node_id": "F11", "node_type": "PROCESS", "label": "Append count to counts", "line": 11, "data": {"ast_kind": "AppendNode"}}, "F12": {"node_id": "F12", "node_type": "RETURN", "label": "Return counts", "line": 13, "data": {"ast_kind": "ReturnNode"}}}, "edges": [{"source": "F4", "target": "F5", "label": "NEXT"}, {"source": "F9", "target": "F10", "label": "TRUE"}, {"source": "F8", "target": "F9", "label": "ITERATE"}, {"source": "F10", "target": "F8", "label": "LOOP"}, {"source": "F9", "target": "F8", "label": "LOOP"}, {"source": "F7", "target": "F8", "label": "NEXT"}, {"source": "F8", "target": "F11", "label": "NEXT"}, {"source": "F6", "target": "F7", "label": "ITERATE"}, {"source": "F11", "target": "F6", "label": "LOOP"}, {"source": "F5", "target": "F6", "label": "NEXT"}, {"source": "F6", "target": "F12", "label": "NEXT"}, {"source": "F3", "target": "F4", "label": "BODY"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F12", "target": "F2", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "FunctionNode", "line": 1, "name": "COUNT_VOWELS", "parameters": [{"kind": "ParameterNode", "line": 1, "name": "text", "declared_type": null}], "body": {"kind": "BlockNode", "line": 2, "statements": [{"kind": "AssignmentNode", "line": 2, "target": {"kind": "IdentifierNode", "line": 2, "name": "vowels"}, "value": {"kind": "CallNode", "line": 2, "name": "list_value", "arguments": [{"kind": "LiteralNode", "line": 2, "value": "a", "data_type": "STRING"}, {"kind": "LiteralNode", "line": 2, "value": "e", "data_type": "STRING"}, {"kind": "LiteralNode", "line": 2, "value": "i", "data_type": "STRING"}, {"kind": "LiteralNode", "line": 2, "value": "o", "data_type": "STRING"}, {"kind": "LiteralNode", "line": 2, "value": "u", "data_type": "STRING"}]}}, {"kind": "AssignmentNode", "line": 3, "target": {"kind": "IdentifierNode", "line": 3, "name": "counts"}, "value": {"kind": "EmptyLiteralNode", "line": 3, "empty_type": "LIST"}}, {"kind": "ForEachNode", "line": 4, "variable": {"kind": "IdentifierNode", "line": 4, "name": "v"}, "collection": {"kind": "IdentifierNode", "line": 4, "name": "vowels"}, "body": {"kind": "BlockNode", "line": 5, "statements": [{"kind": "AssignmentNode", "line": 5, "target": {"kind": "IdentifierNode", "line": 5, "name": "count"}, "value": {"kind": "LiteralNode", "line": 5, "value": 0, "data_type": "INTEGER"}}, {"kind": "ForEachNode", "line": 6, "variable": {"kind": "IdentifierNode", "line": 6, "name": "c"}, "collection": {"kind": "IdentifierNode", "line": 6, "name": "text"}, "body": {"kind": "BlockNode", "line": 7, "statements": [{"kind": "IfNode", "line": 7, "condition": {"kind": "BinaryNode", "line": 7, "operator": "==", "left": {"kind": "IdentifierNode", "line": 7, "name": "c"}, "right": {"kind": "IdentifierNode", "line": 7, "name": "v"}}, "then_body": {"kind": "BlockNode", "line": 8, "statements": [{"kind": "AssignmentNode", "line": 8, "target": {"kind": "IdentifierNode", "line": 8, "name": "count"}, "value": {"kind": "BinaryNode", "line": 8, "operator": "+", "left": {"kind": "IdentifierNode", "line": 8, "name": "count"}, "right": {"kind": "LiteralNode", "line": 8, "value": 1, "data_type": "INTEGER"}}}]}, "else_if": [], "else_body": null}]}}, {"kind": "AppendNode", "line": 11, "value": {"kind": "IdentifierNode", "line": 11, "name": "count"}, "collection": {"kind": "IdentifierNode", "line": 11, "name": "counts"}}]}}, {"kind": "ReturnNode", "line": 13, "expression": {"kind": "IdentifierNode", "line": 13, "name": "counts"}}]}}]}};
const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>
