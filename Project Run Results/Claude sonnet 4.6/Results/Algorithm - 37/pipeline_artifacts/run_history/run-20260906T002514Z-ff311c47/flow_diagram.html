<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>NL-FDEP Flow Diagram</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>

const diagramData = {"format": "NL-FDEP Flow Diagram", "version": "1.0", "entry_node": "F1", "exit_node": "F2", "nodes": {"F1": {"node_id": "F1", "node_type": "START", "label": "Start", "line": 1, "data": {}}, "F2": {"node_id": "F2", "node_type": "END", "label": "End", "line": 1, "data": {}}, "F3": {"node_id": "F3", "node_type": "CLASS", "label": "Class Stack", "line": 1, "data": {"ast_kind": "ClassNode", "name": "Stack"}}, "F4": {"node_id": "F4", "node_type": "DECLARATION", "label": "Declare property data as LIST", "line": 2, "data": {"ast_kind": "PropertyDeclarationNode"}}, "F5": {"node_id": "F5", "node_type": "CONSTRUCTOR", "label": "Run constructor", "line": 4, "data": {"ast_kind": "ConstructorNode"}}, "F6": {"node_id": "F6", "node_type": "PROCESS", "label": "Set data of THIS to an empty list", "line": 5, "data": {"ast_kind": "PropertyAssignmentNode"}}, "F7": {"node_id": "F7", "node_type": "METHOD", "label": "Run method push with item", "line": 8, "data": {"ast_kind": "MethodNode", "name": "push"}}, "F8": {"node_id": "F8", "node_type": "PROCESS", "label": "Append item to data of THIS", "line": 9, "data": {"ast_kind": "AppendNode"}}, "F9": {"node_id": "F9", "node_type": "METHOD", "label": "Run method pop", "line": 13, "data": {"ast_kind": "MethodNode", "name": "pop"}}, "F10": {"node_id": "F10", "node_type": "DECISION", "label": "The length of data of THIS is equal to 0?", "line": 14, "data": {"ast_kind": "IfNode"}}, "F11": {"node_id": "F11", "node_type": "RETURN", "label": "Return \"Underflow\"", "line": 15, "data": {"ast_kind": "ReturnNode"}}, "F12": {"node_id": "F12", "node_type": "RETURN", "label": "Return remove and return last item from data of THIS", "line": 17, "data": {"ast_kind": "ReturnNode"}}, "F13": {"node_id": "F13", "node_type": "METHOD", "label": "Run method peek", "line": 21, "data": {"ast_kind": "MethodNode", "name": "peek"}}, "F14": {"node_id": "F14", "node_type": "DECISION", "label": "The length of data of THIS is equal to 0?", "line": 22, "data": {"ast_kind": "IfNode"}}, "F15": {"node_id": "F15", "node_type": "RETURN", "label": "Return \"Empty\"", "line": 23, "data": {"ast_kind": "ReturnNode"}}, "F16": {"node_id": "F16", "node_type": "RETURN", "label": "Return item negative 1 of data of THIS", "line": 25, "data": {"ast_kind": "ReturnNode"}}}, "edges": [{"source": "F5", "target": "F6", "label": "BODY"}, {"source": "F4", "target": "F5", "label": "NEXT"}, {"source": "F7", "target": "F8", "label": "BODY"}, {"source": "F6", "target": "F7", "label": "NEXT"}, {"source": "F10", "target": "F11", "label": "TRUE"}, {"source": "F10", "target": "F12", "label": "NEXT"}, {"source": "F9", "target": "F10", "label": "BODY"}, {"source": "F8", "target": "F9", "label": "NEXT"}, {"source": "F14", "target": "F15", "label": "TRUE"}, {"source": "F14", "target": "F16", "label": "NEXT"}, {"source": "F13", "target": "F14", "label": "BODY"}, {"source": "F3", "target": "F4", "label": "BODY"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F11", "target": "F2", "label": "NEXT"}, {"source": "F12", "target": "F2", "label": "NEXT"}, {"source": "F15", "target": "F2", "label": "NEXT"}, {"source": "F16", "target": "F2", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "ClassNode", "line": 1, "name": "Stack", "parameters": [], "body": {"kind": "BlockNode", "line": 2, "statements": [{"kind": "PropertyDeclarationNode", "line": 2, "name": "data", "declared_type": "LIST"}, {"kind": "ConstructorNode", "line": 4, "parameters": [], "body": {"kind": "BlockNode", "line": 5, "statements": [{"kind": "PropertyAssignmentNode", "line": 5, "target": {"kind": "MemberAccessNode", "line": 5, "object": {"kind": "IdentifierNode", "line": 5, "name": "THIS"}, "member": "data"}, "value": {"kind": "EmptyLiteralNode", "line": 5, "empty_type": "LIST"}}]}}, {"kind": "MethodNode", "line": 8, "name": "push", "parameters": [{"kind": "ParameterNode", "line": 8, "name": "item", "declared_type": null}], "body": {" const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>
</body>
</html>
