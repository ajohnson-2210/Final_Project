<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NL-FDEP Flow Diagram</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f7; color: #16191f; }
header { position: sticky; top: 0; z-index: 10; padding: 14px 18px; background: white; border-bottom: 1px solid #c9cdd3; }
header h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0; color: #555d69; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.controls input { min-width: 220px; flex: 1; padding: 8px 10px; border: 1px solid #9da4ae; border-radius: 5px; }
.controls button { padding: 8px 12px; border: 1px solid #8f97a3; border-radius: 5px; background: white; cursor: pointer; }
.viewport { overflow: hidden; width: 100%; height: calc(100vh - 108px); background: white; cursor: grab; }
.viewport.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; user-select: none; }
.flow-node { cursor: pointer; }
.flow-node .shape { fill: white; stroke: #20242a; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.flow-node text { fill: #111418; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.flow-node .metadata { fill: #606874; font-size: 10px; }
.flow-node.match .shape { stroke: #d18b00; stroke-width: 4; }
.flow-node.selected .shape { stroke: #1769aa; stroke-width: 4; }
.flow-edge { fill: none; stroke: #252a31; stroke-width: 1.45; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.edge-label rect { fill: white; stroke: none; }
.edge-label text { fill: #20242a; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
.legend { position: fixed; right: 14px; bottom: 14px; padding: 9px 11px; background: rgba(255,255,255,.94); border: 1px solid #c9cdd3; border-radius: 6px; font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>

<p>Standard flowchart notation generated from AJ pseudocode.</p>

tle><rect class="shape" x="265.0" y="90" width="230" height="64" rx="32" ry="32"></rect><text x="380.0" y="115.0"><tspan x="380.0" dy="0">Start</tspan></text><text class="metadata" x="380.0" y="141">Line 1 · F1</text></g><g class="flow-node" data-node-id="F2"><title>END | Line 1 | F2</title><rect class="shape" x="265.0" y="1469" width="230" height="64" rx="32" ry="32"></rect><text x="380.0" y="1494.0"><tspan x="380.0" dy="0">End</tspan></text><text class="metadata" x="380.0" y="1520">Line 1 · F2</text></g><g class="flow-node" data-node-id="F3"><title>FUNCTION | Line 1 | F3</title><rect class="shape" x="265.0" y="287" width="230" height="64"></rect><line class="shape" x1="277.0" y1="287" x2="277.0" y2="351"></line><line class="shape" x1="483.0" y1="287" x2="483.0" y2="351"></line><text x="380.0" y="304.0"><tspan x="380.0" dy="0">Run function find_largest with</tspan><tspan x="380.0" dy="16">numbers</tspan></text><text class="metadata" x="380.0" y="338">Line 1 · F3</text></g><g class="flow-node" data-node-id="F4"><title>DECISION | Line 2 | F4</title><polygon class="shape" points="380.0,484 495.0,540.0 380.0,596 265.0,540.0"></polygon><text x="380.0" y="525.0"><tspan x="380.0" dy="0">The length of numbers is equal</tspan><tspan x="380.0" dy="16">to 0?</tspan></text><text class="metadata" x="380.0" y="583">Line 2 · F4</text></g><g class="flow-node" data-node-id="F5"><title>RAISE | Line 3 | F5</title><rect class="shape" x="615.0" y="508.0" width="230" height="64" rx="4" ry="4"></rect><text x="730.0" y="525.0"><tspan x="730.0" dy="0">Raise error &quot;The list cannot</tspan><tspan x="730.0" dy="16">be empty&quot;</tspan></text><text class="metadata" x="730.0" y="559.0">Line 3 · F5</text></g><g class="flow-node" data-node-id="F6"><title>PROCESS | Line 5 | F6</title><rect class="shape" x="265.0" y="681" width="230" height="64" rx="4" ry="4"></rect><text x="380.0" y="698.0"><tspan x="380.0" dy="0">Set largest to item 0 of</tspan><tspan x="380.0" dy="16">numbers</tspan></text </svg>
</div>
<div class="legend">Oval: Start/End<br>Diamond: Decision<br>Parallelogram: Input/Output<br>Rectangle: Process<br>Double rectangle: Function/Call</div>
<script>
const diagramData = {"format": "NL-FDEP Flow Diagram", "version": "1.0", "entry_node": "F1", "exit_node": "F2", "nodes": {"F1": {"node_id": "F1", "node_type": "START", "label": "Start", "line": 1, "data": {}}, "F2": {"node_id": "F2", "node_type": "END", "label": "End", "line": 1, "data": {}}, "F3": {"node_id": "F3", "node_type": "FUNCTION", "label": "Run function find_largest with numbers", "line": 1, "data": {"ast_kind": "FunctionNode", "name": "find_largest"}}, "F4": {"node_id": "F4", "node_type": "DECISION", "label": "The length of numbers is equal to 0?", "line": 2, "data": {"ast_kind": "IfNode"}}, "F5": {"node_id": "F5", "node_type": "RAISE", "label": "Raise error \"The list cannot be empty\"", "line": 3, "data": {"ast_kind": "RaiseNode"}}, "F6": {"node_id": "F6", "node_type": "PROCESS", "label": "Set largest to item 0 of numbers", "line": 5, "data": {"ast_kind": "AssignmentNode"}}, "F7": {"node_id": "F7", "node_type": "LOOP_DECISION", "label": "For each number in numbers", "line": 6, "data": {"ast_kind": "ForEachNode"}}, "F8": {"node_id": "F8", "node_type": "DECISION", "label": "Number is greater than largest?", "line": 7, "data": {"ast_kind": "IfNode"}}, "F9": {"node_id": "F9", "node_type": "PROCESS", "label": "Set largest to number", "line": 8, "data": {"ast_kind": "AssignmentNode"}}, "F10": {"node_id": "F10", "node_type": "OUTPUT", "label": "Display \"The largest value is {largest}\"", "line": 11, "data": {"ast_kind": "OutputNode"}}, "F11": {"node_id": "F11", "node_type": "RETURN", "label": "Return largest", "line": 12, "data": {"ast_kind": "ReturnNode"}}, "F12": {"node_id": "F12", "node_type": "END", "label": "End after error", "line": 3, "data": {"terminal_reason": "RAISE", "source_node": "F5"}}}, "edges": [{"source": "F4", "target": "F5", "label": "TRUE"}, {"source": "F4", "target": "F6", "label": "FALSE"}, {"source": "F8", "target": "F9", "label": "TRUE"}, {"source": "F7", "target": "F8", "label": "ITERATE"}, {"source": "F9", "target": "F7", "label": "LOOP"}, {"source": "F8", "target": "F7", "label": "LOOP"}, {"source": "F6", "target": "F7", "label": "NEXT"}, {"source": "F7", "target": "F10", "label": "NEXT"}, {"source": "F10", "target": "F11", "label": "NEXT"}, {"source": "F3", "target": "F4", "label": "BODY"}, {"source": "F1", "target": "F3", "label": "NEXT"}, {"source": "F11", "target": "F2", "label": "NEXT"}, {"source": "F5", "target": "F12", "label": "NEXT"}], "structured_program": {"kind": "ProgramNode", "line": 1, "body": [{"kind": "FunctionNode", "line": 1, "name": "find_largest", "parameters": [{"kind": "ParameterNode", "line": 1, "name": "numbers", "declared_type": "LIST"}], "body": {"kind": "BlockNode", "line": 2, "statements": [{"kind": "IfNode", "line": 2, "condition": {"kind": "BinaryNode", "line": 2, "operator": "==", "left": {"kind": "LengthNode", "line": 2, "expression": {"kind": "IdentifierNode", "line": 2, "name": "numbers"}}, "right": {"kind": "LiteralNode", "line": 2, "value": 0, "data_type": "INTEGER"}}, "then_body": {"kind": "BlockNode", "line": 3, "statements": [{"kind": "RaiseNode", "line": 3, "expression": {"kind": "LiteralNode", "line": 3, "value": "The list cannot be empty", "data_type": "STRING"}}]}, "else_if": [], "else_body": null}, {"kind": "AssignmentNode", "line": 5, "target": {"kind": "IdentifierNode", "line": 5, "name": "largest"}, "value": {"kind": "IndexNode", "line": 5, "collection": {"kind": "IdentifierNode", "line": 5, "name": "numbers"}, "index": {"kind": "LiteralNode", "line": 5, "value": 0, "data_type": "INTEGER"}}}, {"kind": "ForEachNode", "line": 6, "variable": {"kind": "IdentifierNode", "line": 6, "name": "number"}, "collection": {"kind": "IdentifierNode", "line": 6, "name": "numbers"}, "body": {"kind": "BlockNode", "line": 7, "statements": [{"kind": "IfNode", "line": 7, "condition": {"kind": "BinaryNode", "line": 7, "operator": ">", "left": {"kind": "IdentifierNode", "line": 7, "name": "number"}, "right": {"kind": "IdentifierNode", "line": 7, "name": "largest"}}, "then_body": {"kind": "BlockNode", "line": 8, "statements": [{"kind": "AssignmentNode", "line": 8, "target": {"kind": "IdentifierNode", "line": 8, "name": "largest"}, "value": {"kind": "IdentifierNode", "line": 8, "name": "number"}}]}, "else_if": [], "else_body": null}]}}, {"kind": "OutputNode", "line": 11, "expression": {"kind": "LiteralNode", "line": 11, "value": "The largest value is {largest}", "data_type": "STRING"}}, {"kind": "ReturnNode", "line": 12, "expression": {"kind": "IdentifierNode", "line": 12, "name": "largest"}}]}}]}};
const svg = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const INITIAL_SCALE = 1.15;
let scale = INITIAL_SCALE;
let translateX = 0;
let translateY = 0;
let dragging = false;
let startX = 0;
let startY = 0;

function applyTransform() {
    canvas.setAttribute('transform', `translate(${translateX} ${translateY}) scale(${scale})`);
}

function initialView() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    scale = INITIAL_SCALE;
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = 28 - box.y * scale;
    applyTransform();
}

function fitDiagram() {
    const box = canvas.getBBox();
    const visibleWidth = viewport.clientWidth;
    const visibleHeight = viewport.clientHeight;
    scale = Math.min(visibleWidth / (box.width + 80), visibleHeight / (box.height + 80), 1.3);
    translateX = (visibleWidth - box.width * scale) / 2 - box.x * scale;
    translateY = (visibleHeight - box.height * scale) / 2 - box.y * scale;
    applyTransform();
}

document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.15; applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale /= 1.15; applyTransform(); });
document.getElementById('fit').addEventListener('click', fitDiagram);

document.getElementById('search').addEventListener('input', event => {
    const query = event.target.value.trim().toLowerCase();
    document.querySelectorAll('.flow-node').forEach(node => {
        node.classList.toggle('match', query.length > 0 && node.textContent.toLowerCase().includes(query));
    });
});

document.querySelectorAll('.flow-node').forEach(node => {
    node.addEventListener('click', () => node.classList.toggle('selected'));
});

viewport.addEventListener('mousedown', event => {
    dragging = true;
    startX = event.clientX - translateX;
    startY = event.clientY - translateY;
    viewport.classList.add('dragging');
});
window.addEventListener('mousemove', event => {
    if (!dragging) return;
    translateX = event.clientX - startX;
    translateY = event.clientY - startY;
    applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    applyTransform();
}, { passive: false });
window.addEventListener('load', initialView);
window.addEventListener('resize', initialView);
</script>
</body>
</html>
